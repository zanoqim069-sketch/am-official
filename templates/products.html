{% extends "layout.html" %}{% block content %}<div class="eyebrow">Collezione AM</div><h1>Prodotti artigianali</h1><p class="muted">Catalogo dimostrativo. Le richieste non comportano addebiti.</p><div class="grid">{% for p in products %}<article class="card"><div class="art">✦</div><h3>{{p.title}}</h3><p class="muted">{{p.description}}</p><p class="price">€ {{'%.2f'|format(p.price)}}</p><p class="small">Disponibilità: {{p.stock}}</p><form method="post" action="/orders/create/{{p.id}}"><button {% if p.stock==0 %}disabled{% endif %}>Richiedi ordine</button></form></article>{% endfor %}</div>{% endblock %}
