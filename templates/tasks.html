{% extends "layout.html" %}{% block content %}<div class="eyebrow">Community</div><h1>Attività</h1><p class="muted">Attività reali, nessun deposito o acquisto richiesto per partecipare.</p><div class="grid">{% for t in tasks %}<article class="card"><h2>{{t.title}}</h2><p class="muted">{{t.description}}</p><p><span class="tag">{{t.reward}}</span></p><form method="post" action="/tasks/submit/{{t.id}}"><label>La tua partecipazione</label><textarea name="note" minlength="10" maxlength="2000" required placeholder="Descrivi il lavoro svolto"></textarea><button>Invia per revisione</button></form></article>{% endfor %}</div>{% endblock %}
